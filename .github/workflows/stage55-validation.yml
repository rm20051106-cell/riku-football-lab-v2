name: Stage 55 video and form evidence quality validation

on:
  push:
    branches:
      - feature/stage55-video-form-quality-20261105

concurrency:
  group: stage55-video-form-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium webkit
      - name: Check Python syntax
        run: python -m compileall -q backend tests
      - name: Check inline and application JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>([\s\S]*?)</script>", html, re.I)
          if not scripts:
              raise SystemExit("No inline scripts found")
          Path("/tmp/riku-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/riku-inline.js
          node --check stage47-video-recovery.js
          node --check stage48-video-restore.js
          node --check sw.js
      - name: Run complete unit and browser regression suite
        run: python -m unittest discover -s tests -v
      - name: Build backend Docker image
        run: docker build -t riku-football-lab-ai ./backend
