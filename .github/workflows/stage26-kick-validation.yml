name: Validate RIKU FOOTBALL LAB - Stage 26 Kick Timeline

on:
  push:
    branches: [feature/stage26-kick-phase-timeline-20261103]
  pull_request:
    branches: [feature/stage25-kick-form-assessment-20261103]

jobs:
  kick-phase-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Stage 26 phase regression tests
        run: python -m unittest discover -s tests -p "test_stage26_phase.py" -v
