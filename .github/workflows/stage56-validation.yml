name: Stage 56 video and form evidence quality validation

on:
  push:
    branches:
      - feature/stage56-resumable-long-video-upload-20261105

concurrency:
  group: stage56-video-form-quality-v7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install portable ffmpeg
        timeout-minutes: 5
        run: |
          python -m pip install --disable-pip-version-check imageio-ffmpeg
          FFMPEG_EXE="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          mkdir -p /tmp/riku-ffmpeg-bin
          ln -sf "$FFMPEG_EXE" /tmp/riku-ffmpeg-bin/ffmpeg
          export PATH="/tmp/riku-ffmpeg-bin:$PATH"
          echo "/tmp/riku-ffmpeg-bin" >> "$GITHUB_PATH"
          ffmpeg -version
      - name: Install Playwright Python package
        run: python -m pip install --disable-pip-version-check playwright
      - name: Install Chromium and WebKit system dependencies
        timeout-minutes: 8
        run: python -m playwright install-deps chromium webkit
      - name: Install Chromium and WebKit browsers
        timeout-minutes: 8
        run: python -m playwright install chromium webkit
      - name: Check Python syntax
        run: python -m compileall -q backend tests
      - name: Check inline and application JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>([\s\S]*?)</script>", html, re.I)
          if not scripts:
              raise SystemExit("No inline scripts found")
          Path("/tmp/riku-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/riku-inline.js
          node --check stage47-video-recovery.js
          node --check stage48-video-restore.js
          node --check sw.js
      - name: Run complete unit and browser regression suite
        run: python -m unittest discover -s tests -v
      - name: Build backend Docker image
        run: docker build -t riku-football-lab-ai ./backend
      - name: Verify 15 and 20 minute backend chunk receipt in Docker
        run: docker run --rm -v "$PWD/tests/test_backend_match_upload_integration.py:/tmp/test_backend_match_upload_integration.py:ro" riku-football-lab-ai python /tmp/test_backend_match_upload_integration.py
