name: Validate RIKU FOOTBALL LAB - Stage 21

on:
  push:
    branches: [feature/stage20-player-dossier-monthly-growth-20261103, feature/stage21-growth-goal-training-linkage-20261103]
  pull_request:
    branches: [main, feature/annual-goal-linkage, feature/ai-evidence-and-form-quality, feature/match-review-growth-report, feature/closed-loop-development, feature/adaptive-individual-coach, feature/weekly-load-planner, feature/matchday-recovery-cycle, feature/stage15-integrity-ai-linkage-20261103, feature/stage20-player-dossier-monthly-growth-20261103, feature/stage21-growth-goal-training-linkage-20261103]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  syntax-and-container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: python -m compileall -q backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>([\s\S]*?)</script>", html, re.I)
          if not scripts:
              raise SystemExit("No inline scripts found")
          out = Path("/tmp/riku-inline-scripts")
          out.mkdir(exist_ok=True)
          for index, script in enumerate(scripts):
              (out / f"script-{index}.js").write_text(script, encoding="utf-8")
          print(f"Extracted {len(scripts)} inline script(s)")
          PY
          for file in /tmp/riku-inline-scripts/*.js; do
            node --check "$file"
          done

      - name: Install browser E2E dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium webkit

      - name: Run browser and frontend regression tests
        run: python -m unittest discover -s tests -v

      - name: Build backend Docker image
        run: docker build -t riku-football-lab-ai ./backend
