name: Validate RIKU FOOTBALL LAB - Stage 27 Multi Angle

on:
  push:
    branches: [feature/stage27-multi-angle-kick-review-20261103]
  pull_request:
    branches: [feature/stage26-kick-phase-timeline-20261103]

jobs:
  multi-angle-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Stage 27 multi-angle regression tests
        run: python -m unittest discover -s tests -p "test_stage27_multi_angle.py" -v
