name: Validate RIKU FOOTBALL LAB - Stage 25 Kick Form

on:
  push:
    branches: [feature/stage25-kick-form-assessment-20261103]
  pull_request:
    branches: [main, feature/stage24-form-phase-review-20261103]

jobs:
  kick-form-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Stage 25 form regression tests
        run: python -m unittest discover -s tests -p "test_stage25_kick.py" -v
